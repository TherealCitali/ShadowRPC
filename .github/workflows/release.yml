name: Release

# Bump versionName in app/build.gradle.kts and push to main: if tag v<versionName>
# does not exist yet, a signed APK is built and published as a GitHub release.
on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version and tag
        id: check_version
        run: |
          NEW_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          if [ -z "$NEW_VERSION" ]; then
            echo "Could not find versionName in app/build.gradle.kts"; exit 1
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists. Skipping release."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.new_version }}"
          SIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-signed.apk' | head -n 1)"
          [ -n "$SIGNED" ] || { echo "signed APK not found"; exit 1; }
          mkdir -p release_out
          cp "$SIGNED" "release_out/ShadowRPC-v${VERSION}.apk"
          (cd release_out && sha256sum "ShadowRPC-v${VERSION}.apk" > "ShadowRPC-v${VERSION}.apk.sha256")

      - name: Build changelog
        id: changelog
        shell: bash
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' $RANGE
          } > CHANGELOG_RELEASE.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: v${{ needs.check-version.outputs.new_version }}
          body_path: CHANGELOG_RELEASE.md
          files: |
            release_out/*.apk
            release_out/*.sha256
