name: Build APK and prerelease

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'dev' ]
  pull_request:
    branches: [ 'main', 'dev' ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }} APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Pull requests from forks cannot read secrets, so they only get a debug build.
      - name: Build debug APK (pull request)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug :app:lintDebug

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        run: ./gradlew assembleRelease

      - name: Sign release APK
        id: sign
        if: github.event_name != 'pull_request' && env.KEYSTORE != ''
        uses: ilharp/sign-android-release@v2.0.0
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        with:
          releaseDir: app/build/outputs/apk/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Collect APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release/out
          mkdir -p "$OUT"
          SIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-signed.apk' | head -n 1 || true)"
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$OUT/ShadowRPC-release.apk"
          else
            echo "No signing secrets configured; uploading the unsigned APK."
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$OUT/ShadowRPC-release-unsigned.apk"
          fi

      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ShadowRPC-release
          path: app/build/outputs/apk/release/out/*.apk

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ShadowRPC-debug
          path: app/build/outputs/apk/debug/*.apk

  prerelease:
    name: Publish commit prerelease
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Reruns update the same commit release; different commits do not cancel each other.
    concurrency:
      group: prerelease-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: ShadowRPC-release
          path: apk

      - name: Prepare installable APK and checksum
        id: metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apk/ShadowRPC-release.apk ]; then
            echo "::error::A signed APK is required for prereleases. Configure KEYSTORE, KEY_ALIAS, KEYSTORE_PASSWORD and KEY_PASSWORD in repository secrets. The unsigned build remains available as an Actions artifact."
            exit 1
          fi
          SHORT_SHA="${COMMIT_SHA:0:12}"
          mkdir -p prerelease_apk
          cp apk/ShadowRPC-release.apk "prerelease_apk/ShadowRPC-${SHORT_SHA}.apk"
          (cd prerelease_apk && sha256sum "ShadowRPC-${SHORT_SHA}.apk" > "ShadowRPC-${SHORT_SHA}.apk.sha256")
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: ShadowRPC • ${{ github.ref_name }} • ${{ steps.metadata.outputs.short_sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Automated test build from `${{ github.ref_name }}`.

            **Commit:** ${{ github.sha }}
            **Build:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download the attached `.apk` to install. This is an experimental prerelease, not a stable release.
            The `.sha256` file contains its checksum. The APK uses the repository signing key.
          files: |
            prerelease_apk/*.apk
            prerelease_apk/*.sha256

  prune-prereleases:
    name: Keep newest five prereleases
    needs: prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize cleanup across main/dev without cancelling APK publication jobs.
    concurrency:
      group: shadowrpc-prerelease-cleanup
      cancel-in-progress: false
    steps:
      - name: Delete older published prereleases
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...repo, per_page: 100,
            });
            const prereleases = releases
              .filter(release => release.prerelease && !release.draft)
              .sort((a, b) =>
                Date.parse(b.published_at || b.created_at) - Date.parse(a.published_at || a.created_at)
                || b.id - a.id);
            core.info(`Found ${prereleases.length} published prereleases; keeping the newest 5.`);
            for (const candidate of prereleases.slice(5)) {
              // Re-check in case somebody promoted it to stable after the listing.
              let release;
              try {
                ({ data: release } = await github.rest.repos.getRelease({
                  ...repo, release_id: candidate.id,
                }));
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (!release.prerelease || release.draft) continue;
              core.info(`Deleting prerelease ${release.tag_name} (${release.id}) and its assets.`);
              await github.rest.repos.deleteRelease({ ...repo, release_id: release.id });
              // Do not delete hand-maintained version tags or arbitrary user tags.
              if (/^prerelease-[0-9a-f]{40}$/.test(release.tag_name)) {
                try {
                  await github.rest.git.deleteRef({ ...repo, ref: `tags/${release.tag_name}` });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
